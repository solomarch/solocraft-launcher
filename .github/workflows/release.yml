# Publishes a release when a version tag is pushed:   git tag v1.0.1 && git push origin v1.0.1
# Builds the Windows installer, the Linux AppImage and the in-game mod jars for every supported version.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: ubuntu-22.04
            args: '--bundles appimage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: 'true'
          # Set the repository variable MS_CLIENT_ID (Settings > Secrets and variables > Actions > Variables)
          # once Mojang has approved your Azure app; the launcher then signs in with just a code.
          SOLOCRAFT_MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SoloCraft Launcher ${{ github.ref_name }}'
          releaseBody: 'Install or update with the one-line command in the README.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  client-mod:
    needs: launcher
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6', '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the mod for Minecraft ${{ matrix.mc }}
        working-directory: client-mod
        run: |
          chmod +x gradlew
          bash tools/make-props.sh "${{ matrix.mc }}"
          ./gradlew build -Pmc="${{ matrix.mc }}" --no-daemon
      - name: Attach to the release
        working-directory: client-mod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in build/libs/solocraft-client-*.jar; do
            case "$f" in *-dev.jar|*-sources.jar) continue;; esac
            gh release upload "${{ github.ref_name }}" "$f" --clobber --repo "${{ github.repository }}"
          done
