[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Dev builds: keep our own crate quick to compile, but optimize dependencies
# (hashing, zip, TLS, JSON) so downloads and installs are not painfully slow
# under `npm run tauri dev`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.solocraft-core]
opt-level = 2
